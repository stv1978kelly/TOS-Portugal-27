<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Tam O'Shanter Overseas Golf - Portugal 27">
  <defs>
    <path id="arcTop" d="M 62 200 A 138 138 0 0 1 338 200"/>
    <path id="arcBottom" d="M 52 200 A 148 148 0 0 0 348 200"/>
    <pattern id="tartan" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1d6b3a"/>
      <rect x="0" y="9" width="24" height="6" fill="#1a2a5c" opacity="0.85"/>
      <rect x="9" y="0" width="6" height="24" fill="#1a2a5c" opacity="0.85"/>
      <rect x="0" y="11.5" width="24" height="1" fill="#d4a017"/>
      <rect x="11.5" y="0" width="1" height="24" fill="#d4a017"/>
      <rect x="0" y="3" width="24" height="1.2" fill="#c0392b" opacity="0.8"/>
      <rect x="3" y="0" width="1.2" height="24" fill="#c0392b" opacity="0.8"/>
    </pattern>
    <radialGradient id="ball" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6e4"/>
    </radialGradient>
  </defs>

  <!-- rims -->
  <circle cx="200" cy="200" r="196" fill="#d4a017"/>
  <circle cx="200" cy="200" r="188" fill="#1a2a5c"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="118" fill="none" stroke="#d4a017" stroke-width="1.5"/>

  <!-- ring lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" letter-spacing="4" fill="#d4a017" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">TAM O'SHANTER</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" letter-spacing="3" fill="#d4a017" text-anchor="middle" dominant-baseline="hanging">
    <textPath href="#arcBottom" startOffset="50%">OVERSEAS GOLF</textPath>
  </text>
  <!-- stars between the words -->
  <g fill="#d4a017">
    <polygon points="0,-9 2.6,-2.8 9,-2.8 3.9,1.1 5.9,7.3 0,3.4 -5.9,7.3 -3.9,1.1 -9,-2.8 -2.6,-2.8" transform="translate(37 200)"/>
    <polygon points="0,-9 2.6,-2.8 9,-2.8 3.9,1.1 5.9,7.3 0,3.4 -5.9,7.3 -3.9,1.1 -9,-2.8 -2.6,-2.8" transform="translate(363 200)"/>
  </g>

  <!-- centre: tartan field -->
  <circle cx="200" cy="200" r="116" fill="url(#tartan)"/>
  <circle cx="200" cy="200" r="116" fill="#0d1830" opacity="0.35"/>

  <!-- crossed clubs -->
  <g stroke-linecap="round">
    <g transform="rotate(-38 200 190)">
      <line x1="200" y1="125" x2="200" y2="248" stroke="#e8e0c8" stroke-width="6"/>
      <line x1="200" y1="125" x2="200" y2="158" stroke="#1a1a1a" stroke-width="8"/>
      <path d="M 200 244 q 0 12 -26 12 q -8 0 -8 -6 q 0 -6 34 -12 z" fill="#e8e0c8"/>
    </g>
    <g transform="rotate(38 200 190)">
      <line x1="200" y1="125" x2="200" y2="248" stroke="#e8e0c8" stroke-width="6"/>
      <line x1="200" y1="125" x2="200" y2="158" stroke="#1a1a1a" stroke-width="8"/>
      <path d="M 200 244 q 0 12 26 12 q 8 0 8 -6 q 0 -6 -34 -12 z" fill="#e8e0c8"/>
    </g>
  </g>

  <!-- the tam o'shanter bonnet, with its toorie -->
  <g transform="translate(200 120)">
    <ellipse cx="0" cy="8" rx="58" ry="17" fill="#1a2a5c" stroke="#d4a017" stroke-width="2"/>
    <path d="M -46 6 Q 0 -40 46 6 Q 0 18 -46 6 Z" fill="url(#tartan)" stroke="#d4a017" stroke-width="2"/>
    <rect x="-44" y="14" width="88" height="9" rx="4" fill="#c0392b" stroke="#d4a017" stroke-width="1.5"/>
    <circle cx="0" cy="-22" r="9" fill="#c0392b" stroke="#d4a017" stroke-width="2"/>
  </g>

  <!-- ball on the tee -->
  <g>
    <path d="M 194 218 L 206 218 L 202 232 L 198 232 Z" fill="#d4a017"/>
    <circle cx="200" cy="204" r="15" fill="url(#ball)" stroke="#0d1830" stroke-width="1"/>
    <g fill="#b8c0d0">
      <circle cx="195" cy="199" r="1.6"/><circle cx="202" cy="197" r="1.6"/><circle cx="207" cy="203" r="1.6"/>
      <circle cx="196" cy="207" r="1.6"/><circle cx="203" cy="210" r="1.6"/>
    </g>
  </g>

  <!-- banner: PORTUGAL 27 -->
  <g>
    <path d="M 114 262 L 286 262 L 275 281 L 286 300 L 114 300 L 125 281 Z" fill="#d4a017"/>
    <path d="M 121 267 L 279 267 L 271 281 L 279 295 L 121 295 L 129 281 Z" fill="#1a2a5c"/>
    <text x="200" y="289" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="21" textLength="132" lengthAdjust="spacingAndGlyphs" fill="#ffffff" text-anchor="middle">PORTUGAL 27</text>
  </g>
</svg>
